version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: placement_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=placement_db

  backend:
    build: ./backend
    container_name: placement_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db

  frontend:
    build: ./frontend
    container_name: placement_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  chroma_data: