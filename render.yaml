services:
  # ----------------------------------------------------
  # 1. FastAPI Backend (Docker Web Service)
  # ----------------------------------------------------
  - type: web
    name: placement-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIRECTORY
        value: ./chroma_db
      - key: PORT
        value: 8000

  # ----------------------------------------------------
  # 2. React + Vite Frontend (Static Site)
  # ----------------------------------------------------
  - type: static
    name: placement-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://placement-backend.onrender.com/api/v1
