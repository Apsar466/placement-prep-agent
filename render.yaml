services:
  # ----------------------------------------------------
  # 1. FastAPI Backend (Docker Web Service)
  # ----------------------------------------------------
  - type: web
    name: placement-backend
    runtime: docker
    dockerFilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false # User will set their MongoDB Atlas URI in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false # User will set their Gemini API Key in the Render dashboard
      - key: CHROMA_PERSIST_DIRECTORY
        value: ./chroma_db

  # ----------------------------------------------------
  # 2. React + Vite Frontend (Static Site)
  # ----------------------------------------------------
  - type: web
    name: placement-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://placement-backend.onrender.com/api/v1 # Replace with your actual backend URL once deployed
